# JDK 21 is pinned here on purpose. Gradle 8.14's embedded Kotlin compiler
# parses the running JVM's version string with intlib, which throws
# IllegalArgumentException on JDK 25 ("25.0.4.1") while compiling build
# scripts — so `flutter build apk` fails with a bare "25.0.4.1" and no hint
# that a JDK is involved. JDK 21 matches AGP 8.11.1 and Flutter's own
# toolchain requirement, so builds stop depending on whatever `java` happens
# to be first on PATH.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

# This machine has 7 GB of RAM. -Xmx8G made the Gradle daemon larger than
# physical memory, which the kernel OOM-kills during :app:minifyReleaseWithR8.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.daemon=true
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
